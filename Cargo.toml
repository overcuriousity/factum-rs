[package]
name = "factum"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Forensic note-taking with GPG-signed, tamper-evident (RFC 9162 Merkle tree) case logs"
authors = ["Mario Stöckl <mstoeck3@hs-mittweida.de>"]
license = "BSD-3-Clause"
repository = "https://github.com/overcuriousity/factum-rs"
readme = "README.md"
keywords = ["forensics", "dfir", "notes", "gpg", "merkle"]
categories = ["command-line-utilities", "gui"]
include = ["src/**", "assets/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md", "build.rs"]

[lib]
name = "factum"
path = "src/lib.rs"

[[bin]]
name = "factum"
path = "src/main.rs"

[features]
default = ["gui"]
# the GUI can be left out for headless servers: cargo build --no-default-features
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
flate2 = "1"
hex = "0.4"
log = { version = "0.4", features = ["std"] }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ttf-parser = "0.25"
which = "8"
zip = { version = "9", default-features = false, features = ["deflate"] }

eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
