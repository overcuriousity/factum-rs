[package]
name = "factum"
version = "2.7.0"
edition = "2024"
rust-version = "1.95"
description = "Forensic note-taking with GPG-signed, tamper-evident (RFC 9162 Merkle tree) case logs"
authors = ["Mario Stöckl <mstoeck3@hs-mittweida.de>"]
license = "BSD-3-Clause"
repository = "https://github.com/overcuriousity/factum-rs"
readme = "README.md"
keywords = ["forensics", "dfir", "notes", "gpg", "merkle"]
categories = ["command-line-utilities", "gui"]
include = ["src/**", "assets/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md", "build.rs"]

[lib]
name = "factum"
path = "src/lib.rs"

[[bin]]
name = "factum"
path = "src/main.rs"

[features]
default = ["gui"]
# the GUI can be left out for headless servers: cargo build --no-default-features
gui = ["dep:arboard", "dep:eframe", "dep:egui", "dep:rfd", "dep:ureq", "dep:serde"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1"
dirs = "7"
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = { version = "0.4", features = ["std"] }
md-5 = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }
which = "8"
zip = { version = "9", default-features = false, features = ["deflate"] }

# the image on the clipboard, which egui does not hand over unchanged (it premultiplies the alpha)
arboard = { version = "3", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", optional = true }
rfd = { version = "0.17", optional = true }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
